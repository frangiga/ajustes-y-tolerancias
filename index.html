<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ajustes y Tolerancias</title>
    <style>
        :root {
            --bg-main: #030712;
            --card-bg-center: #0f172a;
            --card-bg-edge: #020617;
            --accent-orange: #ff7700;
            --accent-orange-glow: rgba(255, 119, 0, 0.75);
            --accent-blue: #00f0ff;
            --accent-blue-glow: rgba(0, 240, 255, 0.6);
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255, 119, 0, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
                linear-gradient(to bottom, #030712, #000000);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .quiz-container {
            background: radial-gradient(circle at center, var(--card-bg-center) 0%, var(--card-bg-edge) 100%);
            width: 94%;
            max-width: 440px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), 0 0 20px rgba(255, 119, 0, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.08);
            border: 1.5px solid var(--border-color);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .top-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title-main {
            color: var(--accent-orange);
            font-size: clamp(1.2rem, 4.5vw, 1.45rem);
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 12px var(--accent-orange-glow);
            letter-spacing: 1px;
            width: 100%;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: center;
        }

        label {
            color: var(--accent-blue);
            font-size: clamp(0.78rem, 2.3vw, 0.88rem);
            font-weight: 700;
            text-shadow: 0 0 6px var(--accent-blue-glow);
            width: 100%;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background-color: rgba(3, 7, 18, 0.9);
            border: 1.5px solid var(--border-color);
            color: var(--text-light);
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
            outline: none;
            text-align: center;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-orange-glow), inset 0 2px 5px rgba(0,0,0,0.6);
        }

        .calc-btn {
            background: linear-gradient(135deg, #ff8800, #ff6600);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px var(--accent-orange-glow);
            transition: all 0.2s ease;
        }

        .calc-btn:hover {
            box-shadow: 0 0 30px var(--accent-orange-glow);
            transform: translateY(-1px);
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .results-box {
            background: rgba(3, 7, 18, 0.95);
            border: 1.5px solid var(--border-color);
            border-left: 4px solid var(--accent-orange);
            padding: 10px 12px;
            border-radius: 12px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.7), 0 0 10px rgba(0, 240, 255, 0.05);
            width: 100%;
        }

        .results-box h3 {
            color: var(--accent-blue);
            font-size: 0.9rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-shadow: 0 0 6px var(--accent-blue-glow);
            width: 100%;
        }

        .result-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
            font-size: 0.82rem;
            color: var(--text-muted);
            align-items: center;
            width: 100%;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-row span:last-child {
            color: var(--text-light);
            font-weight: 700;
            margin-top: 1px;
        }

        .highlight-val {
            color: var(--accent-orange) !important;
            font-weight: 900 !important;
            text-shadow: 0 0 8px var(--accent-orange-glow);
        }

        .app-footer {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }

        .app-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 6px var(--accent-blue-glow);
        }

        .app-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="top-section">
            <h1 class="title-main">Ajustes y Tolerancias</h1>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="input-data">Introduce Medida y Ajuste (Ej: 50 H7, 30 js6):</label>
                <input type="text" id="input-data" placeholder="Ej. 50 H7">
            </div>

            <button class="calc-btn" onclick="calcularTolerancias()">Calcular Cotas</button>

            <div class="results-box" id="results">
                <h3>Resultados del Cálculo</h3>
                <div class="result-row"><span>Medida Nominal:</span> <span id="res-nominal">-</span></div>
                <div class="result-row"><span>Ajuste / Tolerancia:</span> <span id="res-tipo">-</span></div>
                <div class="result-row"><span>Límite Máximo:</span> <span id="res-max" class="highlight-val">-</span></div>
                <div class="result-row"><span>Límite Mínimo:</span> <span id="res-min" class="highlight-val">-</span></div>
                <div class="result-row"><span>Tolerancia Total:</span> <span id="res-diff">-</span></div>
            </div>
        </div>

        <footer class="app-footer">
            Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
        </footer>
    </div>

    <script>
        function obtenerIT(D, calidad) {
            const d = D;
            let i = 0.45 * Math.cbrt(d) + 0.001 * d; 

            let factor = 1;
            switch(calidad) {
                case 6: factor = 10; break;
                case 7: factor = 16; break;
                case 8: factor = 25; break;
                case 9: factor = 40; break;
                case 5: factor = 6; break;
                case 10: factor = 64; break;
                default: factor = 16; 
            }
            return (i * factor) / 1000; 
        }

        function calcularTolerancias() {
            const rawText = document.getElementById('input-data').value.trim();
            const match = rawText.match(/^([0-9]+[.,]?[0-9]*)\s*([a-zA-Z]+[0-9]+)$/);

            if (!match) {
                alert("Por favor, introduce el formato correcto combinando medida y ajuste (Ej: 50 H7 o 30 js6).");
                return;
            }

            const nominal = parseFloat(match[1].replace(',', '.'));
            const ajusteCompleto = match[2];
            const letra = ajusteCompleto.replace(/[0-9]/g, '');
            const letraLower = letra.toLowerCase();
            const calidad = parseInt(ajusteCompleto.replace(/[^0-9]/g, ''), 10);

            if (isNaN(nominal) || isNaN(calidad)) {
                alert("Error en el formato de los valores introducidos.");
                return;
            }

            const IT = obtenerIT(nominal, calidad); 
            let supMm = 0;
            let infMm = 0;

            if (letra === 'H') {
                infMm = 0.000;
                supMm = IT;
            } else if (letraLower === 'h') {
                supMm = 0.000;
                infMm = -IT;
            } else if (letraLower === 'js') {
                supMm = IT / 2;
                infMm = -(IT / 2);
            } else if (letraLower === 'g') {
                const es = (0.5 * Math.pow(nominal, 0.34)) / 1000; 
                supMm = -Math.max(0.002, es);
                infMm = supMm - IT;
            } else if (letraLower === 'p') {
                const es = IT; 
                supMm = es + (IT * 0.4); 
                infMm = supMm - IT;
            } else {
                if (letra === letra.toUpperCase()) {
                    infMm = 0.010;
                    supMm = infMm + IT;
                } else {
                    supMm = -0.010;
                    infMm = supMm - IT;
                }
            }

            const limiteMax = nominal + supMm;
            const limiteMin = nominal + infMm;
            const toleranciaTotal = Math.abs(limiteMax - limiteMin);

            document.getElementById('res-nominal').innerText = nominal.toFixed(3) + " mm";
            document.getElementById('res-tipo').innerText = ajusteCompleto;
            document.getElementById('res-max').innerText = limiteMax.toFixed(3) + " mm";
            document.getElementById('res-min').innerText = limiteMin.toFixed(3) + " mm";
            document.getElementById('res-diff').innerText = (toleranciaTotal * 1000).toFixed(1) + " µm (" + toleranciaTotal.toFixed(3) + " mm)";
        }
    </script>
</body>
</html>
