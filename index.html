<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ajustes y Tolerancias CNC</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent-blue: #66fcf1;
            --accent-orange: #ff5722;
            --border-color: #45a29e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 25px;
            text-align: center;
        }

        h1 {
            color: var(--accent-blue);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-orange);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e64a19;
        }

        .results {
            margin-top: 25px;
            background-color: #0b0c10;
            border-left: 4px solid var(--accent-orange);
            padding: 15px;
            border-radius: 4px;
        }

        .results h3 {
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .highlight {
            color: var(--accent-orange);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ajustes y Tolerancias CNC</h1>
        <p>Consulta rápida ISO para mecanizado</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="nominal">Diámetro Nominal (mm):</label>
            <input type="number" id="nominal" placeholder="Ej. 50" step="0.01">
        </div>

        <div class="form-group">
            <label for="tolerance">Tipo de Ajuste / Tolerancia:</label>
            <select id="tolerance">
                <optgroup label="Agujeros">
                    <option value="H7">H7 (Agujero H estándar)</option>
                    <option value="H8">H8 (Agujero H holgado)</option>
                </optgroup>
                <optgroup label="Ejes">
                    <option value="g6">g6 (Juego)</option>
                    <option value="h6">h6 (Neutro / Fino)</option>
                    <option value="p6">p6 (Interferencia)</option>
                </optgroup>
            </select>
        </div>

        <button onclick="calcularTolerancia()">Calcular Límites</button>

        <div class="results" id="output">
            <h3>Resultado:</h3>
            <div class="result-row"><span>Medida Nominal:</span> <span id="resNominal">-</span></div>
            <div class="result-row"><span>Límite Máximo:</span> <span id="resMax" class="highlight">-</span></div>
            <div class="result-row"><span>Límite Mínimo:</span> <span id="resMin" class="highlight">-</span></div>
            <div class="result-row"><span>Tipo de Ajuste:</span> <span id="resTipo">-</span></div>
        </div>
    </div>

    <script>
        function calcularTolerancia() {
            const nominal = parseFloat(document.getElementById('nominal').value);
            const tol = document.getElementById('tolerance').value;

            if (isNaN(nominal) || nominal <= 0) {
                alert("Por favor, introduce un diámetro nominal válido.");
                return;
            }

            // Ejemplo básico de lógica de cálculo/aproximación (Se puede ampliar con tablas ISO reales)
            let sup = 0;
            let inf = 0;

            if (tol === 'H7') {
                // Simplificación lógica básica para ejemplo (depende de rangos ISO 286 reales)
                sup = nominal + 0.030; 
                inf = nominal;
            } else if (tol === 'h6') {
                sup = nominal;
                inf = nominal - 0.016;
            } else if (tol === 'g6') {
                sup = nominal - 0.009;
                inf = nominal - 0.025;
            } else if (tol === 'p6') {
                sup = nominal + 0.026;
                inf = nominal + 0.010;
            }

            document.getElementById('resNominal').innerText = nominal.toFixed(3) + " mm";
            document.getElementById('resMax').innerText = sup.toFixed(3) + " mm";
            document.getElementById('resMin').innerText = inf.toFixed(3) + " mm";
            document.getElementById('resTipo').innerText = tol;
        }
    </script>
</body>
</html>
